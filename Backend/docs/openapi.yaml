    post:
      operationId: post__assessment_sessions_id_responses
      tags:
        - Assessment sessions
      summary: Submit a confirmed text or voice-transcribed answer
      description:
        Partial transcriptions cannot advance the graph. Original transcripts and corrections
        are retained; raw audio is not. Retry with the same key and payload; use resume after
        interruption.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
          description:
            Unique per applicant and operation. Retry with the same key and payload; changed
            payload returns 409.
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
