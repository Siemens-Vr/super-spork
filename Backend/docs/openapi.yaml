openapi: 3.1.0
info:
  title: VML NEXUS API
  version: 0.1.0
  description: Applicant onboarding, private credential review, one-career assessment targets,
    scheduling, assessor-recorded competency results and upskilling plans. Assessment inputs and
    approved rubrics are frozen per attempt; completion unlocks another career target. A
    configurable AI interviewer supports approved scenarios, confirmed text/voice answers,
    persistent checkpoints and assessor-reviewed results. Course delivery is not connected. Fetch
    /auth/csrf first; send its token with every state-changing request. Swagger UI fetches it
    automatically for Try it out. Cookies are managed by the browser. See docs/authentication.md for
    the admin MFA flow.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Applicants
  - name: Documents
  - name: Career catalogue
  - name: Assessments
  - name: Assessment sessions
  - name: Administration
paths:
  /auth/csrf:
    get:
      operationId: get__auth_csrf
      tags:
        - Authentication
      summary: Obtain synchronizer CSRF token
      security: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Csrf'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                required:
                  - data
        '400':
          description: Invalid request or code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission, CSRF, verification, or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Workflow, capacity, eligibility, or uniqueness conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported file signature or MIME type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: External dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
