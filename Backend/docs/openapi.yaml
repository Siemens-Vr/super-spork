      operationId: get__auth_google_callback
      tags:
        - Authentication
      summary: Validate Google response and establish session
      description:
        'OIDC verifies signatures, issuer, audience, expiration, state, nonce and PKCE. JSON
        clients receive the documented JSON response. Browsers accepting HTML receive a 303 redirect
        to fixed routes under FRONTEND_URL: /auth/google/callback for login/linking,
        /register/google for registration, or /login for errors. No authentication tokens are
        included in redirect URLs. An email collision requires explicit authenticated linking.'
