  /admin/assessment-sessions/{id}/approve-results:
    post:
      operationId: post__admin_assessment_sessions_id_approve_results
      tags:
        - Administration
      summary: Approve AI proposals and publish the existing skill-gap report
      description:
        Requires ADMIN role, the operation-specific permission, verified email, and a recent
        successful MFA verification. All consequential changes are audited. Review the conversation
        and evidence first. This uses existing immutable completion and deterministic learning-plan
        rules. Use the existing assessor completion endpoint to submit corrected scores instead.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
          description:
            Unique per applicant and operation. Retry with the same key and payload; changed
            payload returns 409.
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
          description: Fetch GET /auth/csrf using the same cookie jar. Refresh after login, MFA or
            reauthentication.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
