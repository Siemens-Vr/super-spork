    Upload:
      type: object
      properties:
        category:
          type: string
          enum:
            - BACHELOR
            - MASTER
            - PHD
            - DIPLOMA
            - TRANSCRIPT
            - SHORT_COURSE
            - INDUSTRY_CERTIFICATION
            - PROFESSIONAL_REGISTRATION
            - OTHER
          description:
            Select a document category. BACHELOR, MASTER, PHD and DIPLOMA require a certificate
            plus transcripts.
        title:
          anyOf:
            - type: string
              minLength: 2
              maxLength: 200
            - type: string
              const: ''
          description:
            Descriptive name required for OTHER. Other categories use the uploaded filename as
            their title.
        courseName:
          anyOf:
            - type: string
              minLength: 2
              maxLength: 200
            - type: string
              const: ''
          description:
            Course/programme studied, e.g. Software Engineering or Mechatronics Engineering.
            Required for degrees, diplomas, short courses and standalone transcripts.
        certificationName:
          anyOf:
            - type: string
              minLength: 2
              maxLength: 200
            - type: string
              const: ''
          description: Name of the industry certification. Required for INDUSTRY_CERTIFICATION.
        issuer:
          anyOf:
            - type: string
              minLength: 2
              maxLength: 200
            - type: string
              const: ''
          description:
            Issuing organisation or professional body name. Required for INDUSTRY_CERTIFICATION and
            PROFESSIONAL_REGISTRATION.
        institutionId:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: string
              const: ''
          description:
            Select an active institution using GET /institutions?search=...; leave institutionName
            blank.
        institutionName:
          anyOf:
            - type: string
              minLength: 2
              maxLength: 200
            - type: string
              const: ''
          description:
            Type the institution name only when it is not listed; leave institutionId blank. This
            does not add an entry to the shared catalogue.
        issuedAt:
          type: string
          description:
            Optional issue/award date for BACHELOR, MASTER, PHD and DIPLOMA; leave blank if
            unknown. Required only for industry certifications and professional registrations. Use
            YYYY-MM-DD or an ISO datetime; do not send the placeholder string.
          default: ''
          example: ''
        expiresAt:
          type: string
          description: Leave blank for BACHELOR, MASTER, PHD and DIPLOMA. Required for professional
            registrations; optional for industry certifications. If supplied, use YYYY-MM-DD or an
            ISO datetime after issuedAt.
          default: ''
          example: ''
        credentialNumber:
          type: string
          maxLength: 150
        verificationUrl:
          anyOf:
            - type: string
              maxLength: 1000
              format: uri
            - type: string
              const: ''
        file:
          type: string
          format: binary
          description:
            Required certificate/document file (one PDF, JPEG or PNG, at most 10 MB by default).
            For OTHER, supply a descriptive title; otherwise its filename becomes the title.
        transcripts:
          type: array
          items:
            type: string
            format: binary
          minItems: 1
          maxItems: 5
          description:
            Required for BACHELOR, MASTER, PHD and DIPLOMA. Repeat this multipart field for each
            transcript.
      required:
        - category
        - file
      additionalProperties: false
      allOf:
        - if:
            properties:
              category:
                const: BACHELOR
            required:
              - category
          then:
            required:
              - courseName
              - transcripts
            oneOf:
              - required:
                  - institutionId
                properties:
                  institutionId:
                    type: string
                    format: uuid
                  institutionName:
                    const: ''
              - required:
                  - institutionName
                properties:
                  institutionName:
                    type: string
                    minLength: 2
                  institutionId:
                    const: ''
        - if:
            properties:
              category:
                const: MASTER
            required:
              - category
          then:
            required:
              - courseName
              - transcripts
            oneOf:
              - required:
                  - institutionId
                properties:
                  institutionId:
                    type: string
                    format: uuid
                  institutionName:
                    const: ''
              - required:
                  - institutionName
                properties:
                  institutionName:
                    type: string
                    minLength: 2
                  institutionId:
                    const: ''
        - if:
            properties:
              category:
                const: PHD
            required:
              - category
          then:
            required:
              - courseName
              - transcripts
            oneOf:
              - required:
                  - institutionId
                properties:
                  institutionId:
                    type: string
                    format: uuid
                  institutionName:
                    const: ''
              - required:
                  - institutionName
                properties:
                  institutionName:
                    type: string
                    minLength: 2
                  institutionId:
                    const: ''
        - if:
            properties:
              category:
                const: DIPLOMA
            required:
              - category
          then:
            required:
              - courseName
              - transcripts
            oneOf:
              - required:
                  - institutionId
                properties:
                  institutionId:
                    type: string
                    format: uuid
                  institutionName:
                    const: ''
              - required:
                  - institutionName
                properties:
                  institutionName:
                    type: string
                    minLength: 2
                  institutionId:
                    const: ''
        - if:
            properties:
              category:
                const: SHORT_COURSE
            required:
              - category
          then:
            required:
              - courseName
        - if:
            properties:
              category:
                const: INDUSTRY_CERTIFICATION
            required:
              - category
          then:
            required:
              - certificationName
              - issuer
              - issuedAt
        - if:
            properties:
              category:
                const: PROFESSIONAL_REGISTRATION
            required:
              - category
          then:
            required:
              - issuer
              - issuedAt
              - expiresAt
        - if:
            properties:
              category:
                const: TRANSCRIPT
            required:
              - category
          then:
            required:
              - courseName
            oneOf:
              - required:
                  - institutionId
                properties:
                  institutionId:
                    type: string
                    format: uuid
                  institutionName:
                    const: ''
              - required:
                  - institutionName
                properties:
                  institutionName:
                    type: string
                    minLength: 2
                  institutionId:
                    const: ''
        - if:
            properties:
              category:
                const: OTHER
            required:
              - category
          then:
            required:
              - title
      description: >-
        Choose category in Try it out. Required fields depend on category; the server enforces these
        rules.


        | Category | Required metadata | Transcripts |

        | --- | --- | --- |

        | BACHELOR (Bachelor's degree) | courseName, institutionId OR institutionName | 1–5 required
        |

        | MASTER (Master's degree) | courseName, institutionId OR institutionName | 1–5 required |

        | PHD (PhD) | courseName, institutionId OR institutionName | 1–5 required |

        | DIPLOMA (Diploma) | courseName, institutionId OR institutionName | 1–5 required |

        | SHORT_COURSE (Short course) | courseName | Not accepted as attachments |

        | INDUSTRY_CERTIFICATION (Industry certification) | certificationName, issuer, issuedAt |
        Not accepted as attachments |

        | PROFESSIONAL_REGISTRATION (Professional registration) | issuer, issuedAt, expiresAt | Not
        accepted as attachments |

        | TRANSCRIPT (Standalone transcript) | courseName, institutionId OR institutionName | Not
        accepted as attachments |

        | OTHER (Other document) | title | Not accepted as attachments |


        Search GET /institutions?search=... and send the selected institutionId OR a typed
        institutionName, never both. Institution is optional for short courses and professional
        credentials. Swagger exposes all fields; the application frontend controls
        category-dependent visibility and institution autocomplete. Dates accept YYYY-MM-DD or an
        ISO datetime. Every file must be PDF, JPEG or PNG, at most 10 MB by default.
