      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      authenticated:
                        type: boolean
                      csrfToken:
                        type: string
                      registrationRequired:
                        type: boolean
                      requiredFields:
                        type: array
                        items:
                          type: string
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
