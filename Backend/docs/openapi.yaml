  /admin/assessment-attempts/{id}/complete:
    post:
      operationId: post__admin_assessment_attempts_id_complete
      tags:
        - Administration
      summary: Record assessor evidence, calculate skill gaps and create the learning plan
      description:
        Requires ADMIN role, the operation-specific permission, verified email, and a recent
        successful MFA verification. All consequential changes are audited. Requires
        assessments.review and a started attempt. Submit exactly one 0–100 score and supporting
        evidence for each frozen requirement. Results, booking completion, target completion and
        learning recommendations commit atomically. The same idempotency key/results may be retried;
        changed results return 409. Overall score is the weighted mean; each skill gap is
        max(requiredScore-score,0). No employer selection or hiring decision is made.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
          description:
            Unique per applicant and operation. Retry with the same key and payload; changed
            payload returns 409.
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
          description: Fetch GET /auth/csrf using the same cookie jar. Refresh after login, MFA or
            reauthentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAttemptInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AssessmentAttempt'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                required:
