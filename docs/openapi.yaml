      operationId: post__assessments_bookings
      tags:
        - Assessments
      summary: Reserve assessment capacity transactionally
      description:
        One active booking per applicant. No AI session or scores are generated. Successful
        retries return the original booking.
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[a-zA-Z0-9_-]+$
          description:
