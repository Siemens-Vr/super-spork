name: Backend checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U nexus -d nexus_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
      TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
      SESSION_SECRET: ci-isolated-session-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      OTP_PEPPER: ci-isolated-otp-pepper-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      DATA_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run docs:generate
      - run: git diff --exit-code docs/openapi.yaml
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
